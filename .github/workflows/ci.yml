name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: فحص الأسرار
        run: npm run check:secrets
      - name: فحص الأنواع والبناء
        run: npm run build
      - name: الاختبارات
        run: npm test
